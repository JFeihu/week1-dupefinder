[project]
name = "week1-dupefinder"
version = "0.1.0"
description = "W1 练手：重复文件查找 CLI（uv + ruff + pytest + pre-commit）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
dupe = "dupefinder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dupefinder"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
